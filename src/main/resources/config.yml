# Silk Touch Spawner settings

break:
  # Chance (0.0 - 1.0) to drop the spawner when mined with silk touch
  drop-chance: 0.5

  explosions:
    # This is how we pick an explosion when a spawner breaks:
    # We roll a random number from 0 to 1. Check massive first, then large, then small.
    # If the number is below the chance, that explosion happens. Otherwise try the next size down.
    # With the defaults below, you get 10% massive, 30% large, 30% small, and 30% no explosion.
    chance-small: 0.70
    chance-large: 0.40
    chance-massive: 0.10

    # Explosion power per tier
    power-small: 2.0
    power-large: 4.0
    power-massive: 6.0
