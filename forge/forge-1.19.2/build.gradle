plugins {
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'
}

version = "${project.mod_version}-${project.minecraft_version}-${project.modloader}"
group = 'io.github.derec4'
archivesBaseName = project.archives_base_name

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                smp_silk_spawner {
                    source sourceSets.main
                }
            }
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                smp_silk_spawner {
                    source sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', 'smp_silk_spawner', '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods {
                smp_silk_spawner {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.1.3'
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : "smp_silk_spawner",
                "Specification-Vendor"    : "smp_silk_spawner",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${project.version}",
                "Implementation-Vendor"   : "smp_silk_spawner",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(AbstractArchiveTask).configureEach {
    archiveBaseName.set(project.archives_base_name)
    archiveVersion.set("${project.mod_version}-${project.minecraft_version}-${project.modloader}")
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
